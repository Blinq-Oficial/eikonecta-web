<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | EIKONECTA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/logo-eikonecta-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --navy: #1A365D; --accent: #F97316; --navy-light: #E8EDF5; }
    body { font-family:'Inter',sans-serif; background:#fff; color:var(--navy); min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; }
    .heading { font-family:'Montserrat',sans-serif; }

    /* Floating animation */
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-20px) rotate(2deg); } 50% { transform: translateY(-10px) rotate(-1deg); } 75% { transform: translateY(-25px) rotate(1.5deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse404 { 0%,100% { opacity:0.08; } 50% { opacity:0.15; } }

    .hero-img { animation: float 6s ease-in-out infinite; filter: drop-shadow(0 30px 60px rgba(26,54,93,0.15)); }
    .fade-1 { animation: fadeUp 0.7s ease-out 0.2s both; }
    .fade-2 { animation: fadeUp 0.7s ease-out 0.4s both; }
    .fade-3 { animation: fadeUp 0.7s ease-out 0.6s both; }
    .fade-4 { animation: fadeUp 0.7s ease-out 0.8s both; }
    .code-bg { animation: pulse404 4s ease-in-out infinite; }

    main { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; position:relative; }
    .container { max-width:700px; text-align:center; position:relative; z-index:1; }
    .code-bg-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Montserrat',sans-serif; font-weight:900; font-size:min(35vw,320px); color:var(--navy); opacity:0.06; user-select:none; pointer-events:none; line-height:1; }
    .img-container { width:220px; height:220px; margin:0 auto 2rem; }
    .img-container img { width:100%; height:100%; object-fit:contain; }
    h1 { font-size:clamp(1.5rem,4vw,2.5rem); font-weight:800; color:var(--navy); line-height:1.2; margin-bottom:0.75rem; }
    h1 span { color:var(--accent); }
    .subtitle { color:#5976B3; font-size:1.1rem; line-height:1.6; margin-bottom:2rem; max-width:480px; margin-left:auto; margin-right:auto; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; background:var(--accent); color:#fff; font-family:'Montserrat',sans-serif; font-weight:700; font-size:1rem; padding:0.875rem 2rem; border-radius:9999px; text-decoration:none; transition: all 0.3s ease; box-shadow:0 8px 25px rgba(249,115,22,0.3); }
    .btn:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 12px 35px rgba(249,115,22,0.4); background:#EA580C; }
    .btn .material-symbols-outlined { font-size:1.25rem; }
    nav { padding:1rem 0; }
    nav .inner { max-width:1280px; margin:0 auto; padding:0 1.5rem; display:flex; justify-content:center; }
    nav img { height:2.5rem; }
    footer { padding:1.5rem 0; text-align:center; }
    footer p { color:#8FA3CC; font-size:0.75rem; }

    /* Decorative blobs */
    .blob-1 { position:absolute; top:-80px; right:-60px; width:300px; height:300px; background:var(--accent); opacity:0.04; border-radius:50%; filter:blur(80px); }
    .blob-2 { position:absolute; bottom:-60px; left:-80px; width:250px; height:250px; background:#3B82F6; opacity:0.04; border-radius:50%; filter:blur(80px); }
  </style>
</head>
<body>
  <nav><div class="inner"><a href="/"><img src="/assets/img/logo-eikonecta-color.png" alt="EIKONECTA"></a></div></nav>
  <main>
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="code-bg-text code-bg">404</div>
    <div class="container">
      <div class="img-container fade-1">
        <img src="/assets/img/portfolio/eikonecta_detailed_patch.png" alt="Parche Eikonecta" class="hero-img">
      </div>
      <h1 class="heading fade-2">¡Vaya! Parece que esta página <span>salió volando...</span></h1>
      <p class="subtitle fade-3">La página que buscas no existe o fue movida. Pero no te preocupes — tu marca sí puede despegar con nosotros.</p>
      <div class="fade-4">
        <a href="/" class="btn">
          <span class="material-symbols-outlined">home</span>
          Volver al Inicio
        </a>
      </div>
    </div>
  </main>
  <footer><p>© 2026 EIKONECTA · Marketing y Publicidad · Sincelejo, Sucre</p></footer>
</body>
</html>
