<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Restringido | EIKONECTA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/logo-eikonecta-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --navy: #1A365D; --accent: #F97316; --navy-dark: #0B1727; }
    body { font-family:'Inter',sans-serif; background:var(--navy-dark); color:#fff; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; }
    .heading { font-family:'Montserrat',sans-serif; }

    @keyframes slideIn { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:translateX(0); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scanline { 0% { top:-100%; } 100% { top:100%; } }
    @keyframes pulse403 { 0%,100% { opacity:0.05; } 50% { opacity:0.12; } }
    @keyframes glow { 0%,100% { box-shadow:0 0 20px rgba(249,115,22,0.2); } 50% { box-shadow:0 0 40px rgba(249,115,22,0.4); } }

    .fade-1 { animation: fadeUp 0.7s ease-out 0.2s both; }
    .fade-2 { animation: slideIn 0.7s ease-out 0.4s both; }
    .fade-3 { animation: fadeUp 0.7s ease-out 0.6s both; }
    .fade-4 { animation: fadeUp 0.7s ease-out 0.8s both; }

    main { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; position:relative; }
    .container { max-width:900px; display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:center; position:relative; z-index:1; }
    @media (max-width:768px) { .container { grid-template-columns:1fr; text-align:center; } }

    .code-bg-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Montserrat',sans-serif; font-weight:900; font-size:min(30vw,280px); color:#fff; opacity:0.04; user-select:none; pointer-events:none; line-height:1; animation: pulse403 5s ease-in-out infinite; }

    .img-side { position:relative; }
    .img-side img { width:100%; max-width:380px; height:auto; object-fit:contain; filter:drop-shadow(0 20px 50px rgba(0,0,0,0.4)); margin:0 auto; display:block; }
    .scanline { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,rgba(249,115,22,0.5),transparent); animation:scanline 3s linear infinite; pointer-events:none; }

    .badge { display:inline-flex; align-items:center; gap:0.5rem; background:rgba(249,115,22,0.15); color:var(--accent); font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.15em; padding:0.5rem 1rem; border-radius:9999px; border:1px solid rgba(249,115,22,0.3); margin-bottom:1.5rem; }
    .badge .material-symbols-outlined { font-size:1rem; }
    h1 { font-size:clamp(1.5rem,3.5vw,2.25rem); font-weight:800; line-height:1.2; margin-bottom:0.75rem; }
    h1 span { color:var(--accent); }
    .subtitle { color:rgba(255,255,255,0.5); font-size:1rem; line-height:1.6; margin-bottom:2rem; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; background:var(--accent); color:#fff; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.9rem; padding:0.75rem 1.75rem; border-radius:9999px; text-decoration:none; transition:all 0.3s ease; animation:glow 3s ease-in-out infinite; }
    .btn:hover { transform:translateY(-3px) scale(1.03); background:#EA580C; }
    .btn .material-symbols-outlined { font-size:1.1rem; }

    nav { padding:1rem 0; }
    nav .inner { max-width:1280px; margin:0 auto; padding:0 1.5rem; display:flex; justify-content:center; }
    nav img { height:2.5rem; }
    footer { padding:1.5rem 0; text-align:center; }
    footer p { color:rgba(255,255,255,0.2); font-size:0.75rem; }

    .blob-1 { position:absolute; top:-100px; right:-80px; width:350px; height:350px; background:var(--accent); opacity:0.03; border-radius:50%; filter:blur(100px); }
    .blob-2 { position:absolute; bottom:-80px; left:-100px; width:300px; height:300px; background:#3B82F6; opacity:0.03; border-radius:50%; filter:blur(100px); }
  </style>
</head>
<body>
  <nav><div class="inner"><a href="/"><img src="/assets/img/logo-eikonecta-color.png" alt="EIKONECTA"></a></div></nav>
  <main>
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="code-bg-text">403</div>
    <div class="container">
      <div class="img-side fade-1">
        <div class="scanline"></div>
        <img src="/assets/img/portfolio/client_fcv_vehicle_wrap.webp" alt="Zona de producción EIKONECTA">
      </div>
      <div>
        <div class="fade-2">
          <div class="badge">
            <span class="material-symbols-outlined">lock</span>
            Zona Restringida
          </div>
          <h1 class="heading">Acceso <span>Restringido</span></h1>
        </div>
        <p class="subtitle fade-3">Esta zona es exclusiva para nuestros procesos de producción. El contenido que buscas no está disponible públicamente.</p>
        <div class="fade-4">
          <a href="/" class="btn">
            <span class="material-symbols-outlined">arrow_back</span>
            Volver al Inicio
          </a>
        </div>
      </div>
    </div>
  </main>
  <footer><p>© 2026 EIKONECTA · Marketing y Publicidad · Sincelejo, Sucre</p></footer>
</body>
</html>
